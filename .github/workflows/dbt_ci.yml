name: dbt CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One CI run per branch; a new push cancels the previous run.
concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test (CI fixture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nyc_taxi_dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dbt
        run: pip install -r ../requirements.txt

      # Parse first: a Jinja or ref error should fail in seconds, before we
      # spend time building anything.
      - name: Parse
        run: dbt parse --profiles-dir ci

      # The real check. Runs against the committed fixture in data/ci/ rather
      # than the 326 MB gitignored raw data, so every model is actually built
      # and every test actually executed on a pull request.
      - name: Build (seeds + models + tests)
        run: dbt build --profiles-dir ci --vars '{raw_data_glob: "data/ci/yellow_tripdata_*_ci.parquet"}'

      - name: Generate docs
        run: dbt docs generate --profiles-dir ci --vars '{raw_data_glob: "data/ci/yellow_tripdata_*_ci.parquet"}'

      # run_results.json is the artifact to look at when a run fails: it has
      # per-node timing and the failing test's compiled SQL path.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: |
            nyc_taxi_dbt/target/run_results.json
            nyc_taxi_dbt/target/manifest.json
            nyc_taxi_dbt/target/index.html
          retention-days: 14
